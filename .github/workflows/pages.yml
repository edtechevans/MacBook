name: Deploy MacBook Productivity to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate website files and lesson library
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s content.js
          test -s app.js
          test -s favicon.svg
          node --check content.js
          node --check app.js
          node -e 'global.window={};require("./content.js");if(window.TIPS.length!==55||window.TIPS.filter(t=>!t.bonus).length!==51||window.TIPS.some(t=>!t.title||!t.steps||t.steps.length!==3))process.exit(1);console.log("Validated 51 core lessons and 4 bonus lessons");'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
